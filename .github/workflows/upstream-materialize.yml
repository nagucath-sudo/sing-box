name: Generate rebased vendor
on:
  push:
    branches: [release/v1.15.0-dev.20261102-wigner.1]
permissions:
  contents: read
concurrency:
  group: upstream-materialize-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Materialize authoritative sources
        run: |
          git submodule update --init --depth 1 third_party/dae third_party/tailscale
          python3 tools/vendor/materialize.py --keep-work
          python3 tools/vendor/verify.py
      - name: Export generated changes
        run: |
          git diff --binary -- go.mod go.sum deps/vendor-lock.json vendor > "$RUNNER_TEMP/regenerated-vendor.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-vendor-${{ github.sha }}
          path: ${{ runner.temp }}/regenerated-vendor.patch
          if-no-files-found: error
      - name: Verify rebased Linux integration
        run: |
          tags="with_dae,$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          go test -mod=vendor -race -tags "$tags" -count=1 ./common/tls ./protocol/dae ./protocol/tailscale ./protocol/tun ./route/...
          go vet -mod=vendor -tags "$tags" ./common/tls ./protocol/dae ./protocol/tailscale ./protocol/tun ./route/...
